<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" width="1600" height="640" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="640" fill="#f8f9fa"/>

  <!-- Stage headers -->
  <g>
    <circle cx="77" cy="58" r="18" fill="#4338ca"/>
    <text x="77" y="65" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <text x="106" y="66" font-size="24" font-weight="700" fill="#4338ca">CT study</text>

    <circle cx="467" cy="58" r="18" fill="#2563eb"/>
    <text x="467" y="65" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <text x="496" y="66" font-size="24" font-weight="700" fill="#2563eb">Image evidence</text>

    <circle cx="857" cy="58" r="18" fill="#0d9488"/>
    <text x="857" y="65" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
    <text x="886" y="66" font-size="24" font-weight="700" fill="#0d9488">Trust layer</text>

    <circle cx="1247" cy="58" r="18" fill="#16a34a"/>
    <text x="1247" y="65" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
    <text x="1276" y="66" font-size="24" font-weight="700" fill="#16a34a">Output</text>
  </g>

  <!-- Panels -->
  <g fill="#ffffff" stroke-width="2.5">
    <rect x="55" y="95" width="320" height="400" rx="14" stroke="#a5b4fc"/>
    <rect x="445" y="95" width="320" height="400" rx="14" stroke="#93c5fd"/>
    <rect x="835" y="95" width="320" height="400" rx="14" stroke="#5eead4"/>
    <rect x="1225" y="95" width="320" height="400" rx="14" stroke="#86efac"/>
  </g>

  <!-- Arrows -->
  <g stroke="#6b7280" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <line x1="381" y1="295" x2="439" y2="295"/>
    <line x1="771" y1="295" x2="829" y2="295"/>
    <line x1="1161" y1="295" x2="1219" y2="295"/>
  </g>

  <!-- ============ Panel 1: CT study ============ -->
  <rect x="75" y="115" width="280" height="205" rx="10" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5"/>
  <text x="91" y="143" font-size="16" font-weight="700" fill="#6b7280">Header tags</text>
  <g font-size="15" fill="#374151">
    <text x="91" y="176">BodyPartExamined</text>
    <text x="91" y="206">ContrastBolusAgent</text>
    <text x="91" y="236">Modality</text>
    <text x="91" y="266">StudyDescription</text>
  </g>
  <g font-size="15" fill="#1f2937" font-weight="700" text-anchor="end">
    <text x="339" y="176">CHEST</text>
    <text x="339" y="206" font-weight="400" fill="#6b7280">(empty)</text>
    <text x="339" y="236">CT</text>
  </g>
  <rect x="236" y="249" width="103" height="24" rx="12" fill="#fdeedd" stroke="#d9822b" stroke-width="1.5"/>
  <text x="287.5" y="266" font-size="14" font-weight="700" fill="#b4651a" text-anchor="middle">untrusted</text>
  <text x="91" y="302" font-size="13" fill="#6b7280">Free text is read as data only.</text>

  <rect x="75" y="335" width="280" height="140" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="91" y="362" font-size="16" font-weight="700" fill="#6b7280">Axial slice</text>
  <rect x="91" y="373" width="90" height="90" rx="8" fill="#111827"/>
  <ellipse cx="136" cy="418" rx="38" ry="30" fill="#9ca3af"/>
  <ellipse cx="120" cy="414" rx="11" ry="15" fill="#374151"/>
  <ellipse cx="152" cy="414" rx="11" ry="15" fill="#374151"/>
  <circle cx="136" cy="436" r="4" fill="#e5e7eb"/>
  <g font-size="14" fill="#374151">
    <text x="197" y="406">Image slices</text>
    <text x="197" y="426">in Hounsfield</text>
    <text x="197" y="446">units</text>
  </g>
  <text x="197" y="465" font-size="11" fill="#9ca3af">schematic</text>

  <!-- ============ Panel 2: Image evidence ============ -->
  <rect x="465" y="115" width="280" height="120" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="481" y="143" font-size="16" font-weight="700" fill="#6b7280">Existing CT classifier</text>
  <g stroke="#93c5fd" stroke-width="1.2">
    <line x1="494" y1="170" x2="526" y2="164"/><line x1="494" y1="170" x2="526" y2="188"/><line x1="494" y1="170" x2="526" y2="212"/>
    <line x1="494" y1="192" x2="526" y2="164"/><line x1="494" y1="192" x2="526" y2="188"/><line x1="494" y1="192" x2="526" y2="212"/>
    <line x1="494" y1="214" x2="526" y2="164"/><line x1="494" y1="214" x2="526" y2="188"/><line x1="494" y1="214" x2="526" y2="212"/>
    <line x1="526" y1="164" x2="558" y2="176"/><line x1="526" y1="164" x2="558" y2="204"/>
    <line x1="526" y1="188" x2="558" y2="176"/><line x1="526" y1="188" x2="558" y2="204"/>
    <line x1="526" y1="212" x2="558" y2="176"/><line x1="526" y1="212" x2="558" y2="204"/>
  </g>
  <g fill="#2563eb">
    <circle cx="494" cy="170" r="6"/><circle cx="494" cy="192" r="6"/><circle cx="494" cy="214" r="6"/>
    <circle cx="526" cy="164" r="6"/><circle cx="526" cy="188" r="6"/><circle cx="526" cy="212" r="6"/>
    <circle cx="558" cy="176" r="6"/><circle cx="558" cy="204" r="6"/>
  </g>
  <g font-size="13" fill="#374151">
    <text x="585" y="176">Pixels in,</text>
    <text x="585" y="194">scores out.</text>
  </g>
  <text x="585" y="218" font-size="13" font-weight="700" fill="#2f7a4f">Header never read.</text>

  <rect x="465" y="250" width="280" height="125" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="481" y="274" font-size="16" font-weight="700" fill="#6b7280">Body part scores</text>
  <g font-size="13" fill="#374151">
    <text x="481" y="299">head</text>
    <text x="481" y="319">chest</text>
    <text x="481" y="339">abdomen</text>
    <text x="481" y="359">pelvis</text>
  </g>
  <g fill="#dbeafe">
    <rect x="545" y="289" width="180" height="12" rx="6"/>
    <rect x="545" y="309" width="180" height="12" rx="6"/>
    <rect x="545" y="329" width="180" height="12" rx="6"/>
    <rect x="545" y="349" width="180" height="12" rx="6"/>
  </g>
  <g fill="#2563eb">
    <rect x="545" y="289" width="6" height="12" rx="3"/>
    <rect x="545" y="309" width="12" height="12" rx="6"/>
    <rect x="545" y="329" width="175" height="12" rx="6"/>
    <rect x="545" y="349" width="6" height="12" rx="3"/>
  </g>
  <text x="714" y="339" font-size="11" font-weight="700" fill="#ffffff" text-anchor="end">0.97</text>

  <rect x="465" y="390" width="280" height="85" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="481" y="414" font-size="16" font-weight="700" fill="#6b7280">IV contrast score</text>
  <text x="481" y="440" font-size="13" fill="#374151">present</text>
  <rect x="545" y="430" width="180" height="12" rx="6" fill="#dbeafe"/>
  <rect x="545" y="430" width="169" height="12" rx="6" fill="#2563eb"/>
  <text x="708" y="440" font-size="11" font-weight="700" fill="#ffffff" text-anchor="end">0.94</text>
  <text x="481" y="464" font-size="11" fill="#9ca3af">scores are illustrative</text>

  <!-- ============ Panel 3: Trust layer ============ -->
  <rect x="855" y="115" width="280" height="200" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
  <text x="871" y="141" font-size="15" font-weight="700" fill="#6b7280">Score for the tag's value</text>
  <path d="M 875 270 C 895 270 900 192 925 192 C 950 192 955 268 1000 270 Z" fill="#fdeedd" stroke="#d9822b" stroke-width="2"/>
  <path d="M 975 270 C 1020 268 1040 188 1070 188 C 1100 188 1100 268 1115 270 Z" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <line x1="875" y1="270" x2="1115" y2="270" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="985" y1="162" x2="985" y2="278" stroke="#1f2937" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="985" y="308" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">τ</text>
  <text x="977" y="178" font-size="12" fill="#b4651a" text-anchor="end">override / escalate</text>
  <text x="993" y="178" font-size="12" fill="#15803d">accept</text>
  <text x="925" y="290" font-size="12" fill="#b4651a" text-anchor="middle">tag wrong</text>
  <text x="1070" y="290" font-size="12" fill="#15803d" text-anchor="middle">tag right</text>
  <text x="1115" y="306" font-size="11" fill="#9ca3af" text-anchor="end">schematic, not data</text>

  <rect x="855" y="330" width="280" height="82" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="871" y="356" font-size="16" font-weight="700" fill="#6b7280">Conformal calibration</text>
  <text x="871" y="380" font-size="14" fill="#374151">τ keeps the error among accepted</text>
  <text x="871" y="399" font-size="14" fill="#374151">tags at or below α.</text>

  <g font-size="15" font-weight="700" text-anchor="middle">
    <rect x="855" y="426" width="86" height="38" rx="8" fill="#ffffff" stroke="#9bd0b1" stroke-width="2"/>
    <text x="898" y="450" fill="#2f7a4f">Accept</text>
    <rect x="952" y="426" width="86" height="38" rx="8" fill="#e6eefc" stroke="#3b6fd4" stroke-width="3"/>
    <text x="995" y="450" fill="#2a56b0">Override</text>
    <rect x="1049" y="426" width="86" height="38" rx="8" fill="#ffffff" stroke="#e9c58f" stroke-width="2"/>
    <text x="1092" y="450" fill="#b4651a">Escalate</text>
  </g>
  <text x="995" y="484" font-size="12" fill="#6b7280" text-anchor="middle">Example: body part is overridden</text>

  <!-- ============ Panel 4: Output ============ -->
  <rect x="1245" y="115" width="280" height="80" rx="10" fill="#e6eefc" stroke="#3b6fd4" stroke-width="1.5"/>
  <text x="1261" y="142" font-size="16" font-weight="700" fill="#2a56b0">Decision</text>
  <text x="1261" y="168" font-size="15" font-weight="700" fill="#1f2937">Body part: override</text>
  <text x="1261" y="187" font-size="13" fill="#374151">CHEST replaced by abdomen</text>

  <rect x="1245" y="210" width="280" height="140" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="1261" y="236" font-size="16" font-weight="700" fill="#6b7280">Evidence record</text>
  <g font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#1f2937">
    <text x="1261" y="262">{ "field": "body_part",</text>
    <text x="1275" y="280">"tag": "CHEST",</text>
    <text x="1275" y="298">"image": "abdomen 0.97",</text>
    <text x="1275" y="316">"rule": "score below τ",</text>
    <text x="1275" y="334">"decision": "override" }</text>
  </g>

  <rect x="1245" y="365" width="280" height="110" rx="10" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
  <circle cx="1270" cy="388" r="10" fill="#16a34a"/>
  <path d="M 1265 388 L 1269 392 L 1276 384" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1288" y="393" font-size="16" font-weight="700" fill="#15803d">Verified explanation</text>
  <g font-size="13.5" fill="#374151">
    <text x="1261" y="420">The tag reads chest. Image</text>
    <text x="1261" y="439">evidence indicates abdomen (0.97).</text>
    <text x="1261" y="458">Each claim matches the record.</text>
  </g>

  <!-- Bottom band -->
  <rect x="55" y="520" width="1490" height="62" rx="12" fill="#fdf2e3" stroke="#e9c58f" stroke-width="1.5"/>
  <text x="800" y="547" font-size="16" font-weight="700" fill="#8a5412" text-anchor="middle">Free-text header fields (study, series and protocol descriptions) are parsed as data.</text>
  <text x="800" y="567" font-size="16" fill="#8a5412" text-anchor="middle">They are never passed to a model as instructions.</text>

  <text x="1545" y="615" font-size="12" fill="#9ca3af" text-anchor="end">Planned pipeline. All values are an illustrative example.</text>
</svg>
